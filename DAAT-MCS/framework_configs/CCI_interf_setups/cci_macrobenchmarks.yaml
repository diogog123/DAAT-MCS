paths:
  root_dir: "."
  configs_dir: "/configs"
  config_templates: "/setup_generator/config_templates"
  imgs_dir: "./wrkdir_imgs"

setups:
  benchmark: "CCI_macrobenchmarks"
  list_setups: ["cci_baremetal_linux"]

guests:
  baremetal_cci:
    src_dir: "../guests/baremetal/src/baremetal-app/baremetal_CCI"
    cpu_IDs: [[0], [0,1,2,3]]        
    ila:
      test_types: ["TEST_TYPE_SOLO", "TEST_TYPE_DMA", "TEST_TYPE_DMA_FPGA"]
      snoop_types: [1, 2]
      channels: [1, 2, 4, 8]
      coherency: [0, 1]  
  
linux:
  linux_dir: "/home/diogo/Downloads/DAAT-MCS-main/guests/linux"
  build_guest: false
  rebuild_initrd: true
  boot_commands:
    [
      [
        "cci_macrobenchmark",
        "cd /root/benchmarks/MiBench/MiBench/automotive/qsort",
        "seq 10 | xargs -Iz ./runme_small.sh",
        "seq 10 | xargs -Iz ./runme_large.sh",
        "cd /root/benchmarks/MiBench/MiBench/automotive/susan",
        "seq 10 | xargs -Iz ./runme_small.sh",
        "seq 10 | xargs -Iz ./runme_large.sh",
        "cd /root/benchmarks/MiBench/MiBench/automotive/bitcount",
        "seq 10 | xargs -Iz ./runme_small.sh",
        "seq 10 | xargs -Iz ./runme_large.sh",
        "cd /root/benchmarks/MiBench/MiBench/automotive/basicmath",
        "seq 10 | xargs -Iz ./runme_small.sh",
        "seq 10 | xargs -Iz ./runme_large.sh"
      ]
    ]

hardware:
  platform: "zcu104"
  bitstreams:
    - coherency: 0 # non-coherent
      path: "/media/diogo/rootfs/CCI_Interference/DAAT-MCS/bitstreams/bfx.bit"
      ltx: "/media/diogo/rootfs/CCI_Interference/DAAT-MCS/bitstreams/bfx.ltx"
    - coherency: 1 # coherent
      path: "/media/diogo/rootfs/CCI_Interference/DAAT-MCS/bitstreams/bfx_coherent.bit"
      ltx: "/media/diogo/rootfs/CCI_Interference/DAAT-MCS/bitstreams/bfx_coherent.ltx"
  tcl_script: "/media/diogo/rootfs/CCI_Interference/DAAT-MCS/tcl_script/getwaves.tcl"

hypervisor:
  name: "bao"
  src_dir: "/media/diogo/rootfs/CCI_Interference/hypervisor/bao/bao-hypervisor"

setups_configs:
  cci_baremetal_linux:
    guests: ["baremetal_cci","linux"]
    en_cache_coloring: false
    log_ports: ["/dev/ttyUSB1","/dev/ttyUSB2"]